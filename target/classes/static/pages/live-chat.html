<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script src="path/to/live-chat-widget.js" defer></script>
    <style>
        :root {
  --primary: #ffe066;
  --highlight: #8267e5;
  --surface-card: #23243f;
  --surface-2: #22243a;
  --text-soft: #c0c3e6;
  --text-main: #ececf1;
}

    </style>
</head>

<body>
    <script>
        (() => {
            const styleContent = `
    /* Live Chat Styles */
    #liveChatBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--primary, #ffe066);
      color: #22223a;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      box-shadow: 0 2px 18px rgba(20, 20, 34, 0.16);
      cursor: pointer;
      font-size: 1.8rem;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s;
    }
    #liveChatBtn:hover {
      background: #ffd850cc;
    }

    #liveChatWindow {
      position: fixed;
      bottom: 95px;
      right: 25px;
      width: 320px;
      max-height: 430px;
      background: var(--surface-card, #23243f);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(20, 20, 34, 0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 10000;
      font-family: 'Inter', sans-serif;
    }
    #liveChatWindow.open {
      display: flex;
    }
    #liveChatHeader {
      background: var(--highlight, #8267e5);
      color: #fff;
      padding: 12px 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    #liveChatHeader button {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #liveChatMessages {
      flex-grow: 1;
      padding: 12px 14px;
      overflow-y: auto;
      color: var(--text-soft, #c0c3e6);
      font-size: 0.95rem;
      background: var(--surface-2, #22243a);
    }
    .chat-msg {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .chat-msg.user {
      justify-content: flex-end;
    }
    .chat-msg .msg-bubble {
      max-width: 75%;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.3;
      word-wrap: break-word;
    }
    .chat-msg.user .msg-bubble {
      background: var(--primary, #ffe066);
      color: #22223a;
      border-radius: 18px 18px 0 18px;
    }
    .chat-msg.bot .msg-bubble {
      background: var(--highlight, #8267e5);
      color: #fff;
      border-radius: 18px 18px 18px 0;
    }
    #liveChatInputArea {
      display: flex;
      border-top: 1px solid #44485a;
      background: var(--surface, #23254a);
      padding: 8px 12px;
      gap: 8px;
    }
    #liveChatInput {
      flex-grow: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1.5px solid #3e4159;
      background: var(--surface-2, #22243a);
      color: var(--text-main, #ececf1);
      font-size: 1rem;
      outline: none;
    }
    #liveChatSendBtn {
      background: var(--primary, #ffe066);
      color: #22223a;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #liveChatSendBtn:hover {
      background: #ffd850;
    }
  `;

            // Inject style into <head>
            const styleEl = document.createElement('style');
            styleEl.textContent = styleContent;
            document.head.appendChild(styleEl);

            // Inject HTML into <body>
            const widgetHtml = `
    <button id="liveChatBtn" aria-label="Open Live Chat" title="Live Chat" type="button">
      <i class="fa-solid fa-comments"></i>
    </button>

    <div id="liveChatWindow" role="region" aria-live="polite" aria-atomic="true" aria-label="Live chat window">
      <div id="liveChatHeader">
        Live Support
        <button id="liveChatCloseBtn" aria-label="Close Live Chat" type="button">&times;</button>
      </div>
      <div id="liveChatMessages" tabindex="0" aria-live="polite" aria-relevant="additions">
        <!-- Chat messages will appear here -->
      </div>
      <form id="liveChatForm" style="display: flex;" aria-label="Send a message form">
        <input
          type="text"
          id="liveChatInput"
          placeholder="Type your message..."
          autocomplete="off"
          aria-required="true"
          aria-label="Live chat message input"
          required
        />
        <button type="submit" id="liveChatSendBtn" aria-label="Send message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  `;

            document.body.insertAdjacentHTML('beforeend', widgetHtml);

            // Chat logic
            const liveChatBtn = document.getElementById('liveChatBtn');
            const liveChatWindow = document.getElementById('liveChatWindow');
            const liveChatCloseBtn = document.getElementById('liveChatCloseBtn');
            const liveChatForm = document.getElementById('liveChatForm');
            const liveChatInput = document.getElementById('liveChatInput');
            const liveChatMessages = document.getElementById('liveChatMessages');

            const botReplies = [
                "Hello! How can I assist you today?",
                "Could you please provide more details?",
                "Thank you for reaching out. We will respond shortly.",
                "Please check the FAQ section on the site for common questions.",
                "Is there anything else I can help with?",
                "Our support team is currently offline. Please leave a message."
            ];

            function addMessage(msg, sender = 'bot') {
                const messageElem = document.createElement('div');
                messageElem.classList.add('chat-msg', sender);
                const bubble = document.createElement('div');
                bubble.classList.add('msg-bubble');
                bubble.textContent = msg;
                messageElem.appendChild(bubble);
                liveChatMessages.appendChild(messageElem);
                liveChatMessages.scrollTop = liveChatMessages.scrollHeight;
            }

            let chatStarted = false;

            liveChatBtn.addEventListener('click', () => {
                liveChatWindow.classList.add('open');
                liveChatBtn.style.display = 'none';
                if (!chatStarted) {
                    addMessage(botReplies[0], 'bot');
                    chatStarted = true;
                }
                liveChatInput.focus();
            });

            liveChatCloseBtn.addEventListener('click', () => {
                liveChatWindow.classList.remove('open');
                liveChatBtn.style.display = 'flex';
            });

            liveChatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userMsg = liveChatInput.value.trim();
                if (!userMsg) return;
                addMessage(userMsg, 'user');
                liveChatInput.value = '';
                liveChatInput.focus();

                setTimeout(() => {
                    const replyIndex = Math.floor(Math.random() * (botReplies.length - 1)) + 1;
                    addMessage(botReplies[replyIndex], 'bot');
                }, 1200);
            });
        })();

    </script>
</body>

</html>
