<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS-Calendar with Blocks</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ffe066;
      --highlight: #8267e5;
      --bg-dark: #181a23;
      --surface: #23254a;
      --surface-2: #22243a;
      --surface-3: #222236;
      --surface-card: #23243f;
      --text-main: #ececf1;
      --text-soft: #c0c3e6;
      --shadow: 0 2px 18px rgba(20, 20, 34, 0.16);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Inter", "Arial", sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    aside.sidebar {
      width: 250px;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 99;
      min-width: 250px;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0 18px 0;
    }

    .sidebar-header img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px #efd24a55;
      background: #fff;
      margin-bottom: 9px;
    }

    .sidebar-divider {
      width: 60%;
      height: 3px;
      background: linear-gradient(to right, #ffe066 0%, #8267e5 100%);
      border-radius: 2px;
      margin-bottom: 12px;
    }

    .sidebar-logo-text {
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
      user-select: none;
      text-shadow: 0 2px 10px #ffe06610;
      margin-bottom: 19px;
      text-align: center;
      white-space: nowrap;
    }

    .sidebar nav {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar nav a,
    .sidebar nav button {
      font-weight: 600;
      font-size: 1.07rem;
      color: var(--text-main);
      text-decoration: none;
      padding: 13px 20px 13px 17px;
      border-radius: 0 14px 14px 0;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      transition: background 0.13s, color 0.13s;
      border-left: 4px solid transparent;
      margin-left: -1rem;
    }

    .sidebar nav a.active,
    .sidebar nav a:hover,
    .sidebar nav button.active,
    .sidebar nav button:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
      font-weight: 700;
    }

    .sidebar nav i {
      min-width: 33px;
      min-height: 33px;
      font-size: 1.32rem;
      border-radius: 50%;
      background: #262740;
      color: var(--highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.13s;
    }

    .sidebar nav a.active i,
    .sidebar nav a:hover i,
    .sidebar nav button.active i,
    .sidebar nav button:hover i {
      background: var(--highlight);
      color: #fff !important;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      justify-content: space-between;
    }

    .dropdown .fa-chevron-down {
      margin-left: auto;
      font-size: 0.98em;
      transition: transform 0.19s;
    }

    .dropdown.open .fa-chevron-down {
      transform: rotate(180deg);
    }

    .dropdown-list {
      display: none;
      flex-direction: column;
      padding-left: 34px;
      background: transparent;
      margin: 0;
    }

    .dropdown.open .dropdown-list {
      display: flex;
    }

    .dropdown-list a {
      padding: 7px 10px 7px 20px;
      font-size: 0.96em;
      border-radius: 8px;
      margin-left: 0;
      border-left: 4px solid transparent;
    }

    .dropdown-list a.active,
    .dropdown-list a:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
    }

    .sidebar nav .secondary {
      color: var(--text-soft);
      font-weight: 600;
      opacity: 0.86;
      font-size: 0.98rem;
    }

    .sidebar-spacer {
      flex-grow: 10;
    }

    .sidebar-footer {
      padding-left: 7px;
      padding-bottom: 22px;
    }

    .sidebar-footer a {
      color: var(--text-main);
      font-size: 1.07rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 1em;
      padding: 13px 20px 13px 17px;
      border-radius: 0 14px 14px 0;
      transition: background 0.13s, color 0.13s;
      border-left: 4px solid transparent;
      margin-left: -1rem;
      font-weight: 600;
    }

    .sidebar-footer a.active,
    .sidebar-footer a:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
    }

    .sidebar-footer a i {
      min-width: 33px;
      min-height: 33px;
      font-size: 1.32rem;
      border-radius: 50%;
      background: #262740;
      color: var(--highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.13s;
    }

    .sidebar-footer a.active i,
    .sidebar-footer a:hover i {
      background: var(--highlight);
      color: #fff !important;
    }

    main {
      margin-left: 250px;
      padding: 2.5rem 3.5rem 2.5rem 3.5rem;
      flex: 1;
      min-height: 100vh;
      background: var(--bg-dark);
    }

    /* Topbar */
    header.topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.8rem;
    }

    .topbar input[type="text"] {
      width: 100%;
      max-width: 320px;
      background: var(--surface-2);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1.5px solid #3e4159;
      font-size: 1.02rem;
      outline: none;
      box-shadow: 0 1px 8px #ffe06617;
    }

    .profile-menu-container {
      position: relative;
      margin-left: 1.3rem;
    }

    .profile-avatar-btn {
      background: var(--highlight);
      color: #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2.5px solid #ffe06655;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--primary);
      border: none;
      outline: none;
      transition: background 0.16s, color 0.16s;
      text-decoration: none;
      /* No underline */
    }

    .profile-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      min-width: 180px;
      background: var(--surface-3);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      z-index: 40;
      padding: 0.4em 0.1em;
      flex-direction: column;
      color: var(--text-main);
      text-align: left;
    }

    .profile-menu-container.open .profile-dropdown {
      display: flex;
    }

    .profile-dropdown .profile-meta {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.02em;
      margin: 0.2em 0 0.2em 0;
      line-height: 1.2;
    }

    .profile-dropdown .profile-role {
      font-size: 1em;
      padding: 0 1.22em 0.3em 2.15em;
      color: var(--highlight);
      font-style: italic;
      font-weight: 600;
      opacity: 0.82;
    }

    /* Remove underline on dropdown links and buttons */
    .profile-dropdown a,
    .profile-dropdown button {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 0.8em 1.25em;
      text-align: left;
      cursor: pointer;
      font-size: 1.07em;
      font-family: inherit;
      transition: background 0.13s, color 0.12s;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 0.7em;
      text-decoration: none !important;
    }

    .profile-dropdown a:hover,
    .profile-dropdown button:hover {
      background: var(--primary);
      color: #22223a;
    }

    .profile-dropdown i {
      color: var(--highlight);
      font-size: 1.02em;
    }

    /* Notification button and dropdown */
    .notif-btn {
      background: none;
      outline: none;
      border: none;
      padding: 0;
      margin: 0 11px 0 0;
      position: relative;
      cursor: pointer;
      text-decoration: none !important;
    }

    .notif-btn i {
      font-size: 1.54em;
      color: var(--highlight);
      background: transparent;
      border-radius: 50%;
      transition: background 0.12s, color 0.13s;
      padding: 7px 9px;
    }

    .notif-btn:hover i {
      background: #23243f;
      color: var(--primary);
    }

    .notif-badge {
      position: absolute;
      top: 2px;
      right: 0.8rem;
      background: #e64545;
      color: #fff;
      font-size: 0.85em;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 6px;
      min-width: 18px;
      text-align: center;
      box-shadow: 0 0 5px #0005;
      z-index: 2;
      display: inline-block;
    }

    .notif-dropdown {
      position: absolute;
      right: 44px;
      top: 44px;
      min-width: 260px;
      background: var(--surface-3);
      color: var(--text-main);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      z-index: 110;
      padding: 0.3em 0.1em 0.6em 0.1em;
      font-size: 1em;
      max-height: 360px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }

    #notifList {
      max-height: 280px;
      overflow-y: auto;
    }

    .notif-item {
      padding: 0.75em 1.2em;
      border-bottom: 1px solid #23243f55;
      background: none;
      color: inherit;
      cursor: pointer;
      transition: background 0.11s;
      white-space: normal;
      word-wrap: break-word;
    }

    .notif-item.unread {
      background: #ffe06622;
      font-weight: 700;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-dropdown button {
      background: var(--primary);
      color: #22223a;
      border: none;
      padding: 0.65em 1.2em;
      border-radius: 7px;
      margin: 0.45em auto 0;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.02em;
      text-align: center;
      display: block;
    }

    .notif-dropdown button:hover {
      background: var(--highlight);
      color: #fff;
    }

    /* Info Blocks Container with hover & emoji */
    .info-blocks {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: stretch;
      /* NEW: ensures same height */
    }

    .info-block {
      flex: 1 1 180px;
      min-width: 180px;
      min-height: 110px;
      background: var(--surface-card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 1.3rem 1.2rem 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text-main);
      position: relative;
      transition: box-shadow 0.18s, background 0.18s, transform 0.18s;
      cursor: pointer;
      z-index: 1;
    }

    .info-block:hover,
    .info-block:focus-visible {
      background: var(--highlight);
      color: #fff;
      box-shadow: 0 4px 28px #8267e59a, 0 1.5px 7px #ffe06653;
      transform: translateY(-5px) scale(1.03);
      outline: none;
    }

    .info-block .block-emoji {
      font-size: 1.45rem;
      margin-right: 0.23em;
      vertical-align: text-bottom;
      filter: drop-shadow(0 1px 7px #ffe06633);
      user-select: none;
      transition: filter 0.14s;
    }

    .info-block:hover .block-emoji {
      filter: drop-shadow(0 1px 13px #fff5b433);
    }

    .info-block h4 {
      margin: 0 0 0.35rem 0;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.7px;
      font-size: 1.12rem;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }

    .info-block .value {
      font-weight: 800;
      font-size: 2.2rem;
      color: var(--highlight);
      transition: color 0.18s;
      margin-top: auto;
      line-height: 1;
    }

    .info-block:hover .value {
      color: #fffde3;
    }

    .calendar-container {
      display: flex;
      gap: 2rem;
      min-width: 0;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* Calendar Container */
    .calendar {
      background: var(--surface-card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 0.5rem 0.6rem;
      flex: 1 1 240px;
      min-width: 300px;
      max-width: 400px;
      min-height: 280px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow-y: auto;
    }

    /* Calendar Header */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
      min-height: 32px;
    }

    .calendar-header h2 {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1.5px;
    }

    .calendar-header button {
      background: var(--highlight);
      border: none;
      padding: 0.3em 0.65em;
      border-radius: 50%;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .calendar-header button:hover {
      background: #694fd3;
    }

    /* Weekday Labels */
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 800;
      color: var(--primary);
      font-size: 0.93rem;
      margin-bottom: 0.16rem;
      letter-spacing: 1px;
      user-select: none;
    }

    /* Calendar Days Grid */
    .calendar-days {
      transition: opacity 0.2s ease;
      opacity: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.17rem;
      min-height: 160px;
      max-height: 270px;
      overflow-y: auto;
    }

    .calendar-days.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .calendar-days.fade-in {
      opacity: 1;
      pointer-events: auto;
    }

    /* Individual Day Cell */
    .calendar-day {
      padding: 0.23rem 0 0.23rem 0;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.89rem;
      background: transparent;
      min-height: 30px;
      transition: background-color 0.2s ease, color 0.2s;
      position: relative;
      outline-offset: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-width: 0;
      user-select: none;
    }

    .calendar-day:focus {
      outline: 2px solid var(--highlight);
      outline-offset: 2px;
    }

    /* Days from outside the month */
    .calendar-day.outside {
      color: var(--text-soft);
      background: none;
      font-weight: 600;
      cursor: default;
      pointer-events: none !important;
    }

    /* Today’s Date */
    .calendar-day.today {
      background: var(--primary);
      color: #22223a;
      font-weight: 800;
      box-shadow: 0 0 6px var(--primary);
    }

    /* Selected Day */
    .calendar-day.selected {
      background: var(--highlight);
      color: #fff;
    }

    /* Dot indicator for events */
    .calendar-day.event::after {
      content: "";
      display: block;
      width: 5px;
      height: 5px;
      background: var(--primary);
      border-radius: 50%;
      margin: 2px auto 0;
      pointer-events: none;
    }

    /* Spacer cells (empty) */
    .calendar-day.empty {
      background: transparent;
      cursor: default;
      pointer-events: none;
      user-select: none;
    }

    /* Event item inside a day */
    .calendar-event {
      margin-top: 2px;
      font-size: 0.69rem;
      padding: 1px 3px;
      border-radius: 6px;
      background: var(--primary);
      color: #22223a;
      max-width: 93%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: grab;
      font-weight: 600;
    }

    /* Upcoming Events Card */
    .upcoming-events {
      background: var(--surface-card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 0.5rem 0.6rem;
      flex: 1 1 240px;
      min-width: 300px;
      max-width: 400px;
      min-height: 200px;
      max-height: 280px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      color: var(--text-main);
      user-select: none;
      overflow: hidden;
      align-self: flex-start;
    }

    /* Upcoming Events Header */
    .upcoming-events h3 {
      color: var(--primary);
      font-weight: 800;
      font-size: 1.2rem;
      margin: 0;
      min-height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .add-event-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--highlight);
      color: #fff;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .plus-icon {
      margin-right: 6px;
      /* Adjust spacing */
    }

    .add-event-btn:hover {
      background: #5e43b9;
      transform: scale(1.05);
    }

    .add-event-btn:active {
      transform: scale(0.98);
    }

    /* Upcoming Events List */
    .upcoming-events ul {
      list-style: none;
      padding: 10px;
      margin: 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      color: var(--text-soft);
      font-size: 1.13rem;
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: thin;
      /* Firefox */
      scrollbar-color: var(--highlight) transparent;
      overflow-x: hidden;
    }

    /* Scrollbar Styling */
    .upcoming-events ul::-webkit-scrollbar {
      width: 10px;
      background: transparent;
    }

    .upcoming-events ul::-webkit-scrollbar-thumb {
      background: var(--highlight);
      border-radius: 10px;
    }

    /* Upcoming Event List Items */
    .upcoming-events li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-direction: row;
      padding: 0.7rem 0;
      border-bottom: 1px solid #28284e;
    }

    .upcoming-events li:last-child {
      border: none;
    }

    /* Upcoming Event Title */
    .event-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1em;
    }

    /* Upcoming Event Date */
    .event-date {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--highlight);
      margin-top: 3px;
    }

    /* Date Input Wrapper */
    .date-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    /* Date Input Padding */
    .date-input-wrapper input[type="date"] {
      width: 100%;
      padding-right: 36px;
    }

    /* Calendar Icon Right Positioning */
    .calendar-icon-right {
      position: absolute;
      top: 50%;
      right: 16px;
      /* consolidated to single rule */
      transform: translateY(-50%);
      color: #a282fc;
      pointer-events: none;
      font-size: 1.2em;
    }

    /* Improved Event Modal Styles with emoji and icon */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.65);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.23s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal.event-modal {
      background: var(--surface-card);
      border-radius: 16px;
      box-shadow: 0 8px 40px #1d12551c, 0 1.5px 7px #22186e22;
      padding: 2.4rem 2.3rem 1.5rem 2.3rem;
      width: 340px;
      max-width: 97vw;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      color: var(--text-main);
      animation: modalPop 0.21s cubic-bezier(0.3, 1.4, 0.5, 1.07);
    }

    @keyframes modalPop {
      from {
        opacity: 0.2;
        transform: translateY(35px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .modal.event-modal h3 {
      margin-top: 0;
      margin-bottom: 0.33rem;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-align: center;
    }

    .modal-desc {
      text-align: center;
      margin-bottom: 0.67rem;
      color: var(--text-soft);
      font-size: 1.01rem;
      font-weight: 500;
      letter-spacing: 0.15px;
    }

    .modal-group {
      display: flex;
      flex-direction: column;
      gap: 0.36rem;
      margin-bottom: 0.28rem;
      position: relative;
    }

    .modal-group label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.2px;
      display: flex;
      gap: 0.46em;
      align-items: center;
    }

    .modal-group label .input-emoji {
      font-size: 1.16em;
      vertical-align: text-bottom;
      margin-right: 0.06em;
      filter: drop-shadow(0 1px 8px #8267e53a);
    }

    .modal-group input[type="text"],
    .modal-group input[type="date"] {
      padding: 0.53rem 0.95rem 0.53rem 2.35rem;
      font-size: 1.09rem;
      border-radius: 7px;
      border: none;
      outline: none;
      background: var(--surface-2);
      color: var(--text-main);
      font-family: inherit;
      transition: box-shadow 0.16s, border-color 0.14s;
      margin-top: 0.08rem;
      box-shadow: 0 1px 6px #00000008;
    }

    .modal-group .calendar-icon {
      position: absolute;
      left: 0.72rem;
      top: 2.13rem;
      color: var(--highlight);
      font-size: 1.17rem;
      pointer-events: none;
    }

    .modal-group input[type="text"]:focus,
    .modal-group input[type="date"]:focus {
      outline: 2px solid var(--highlight);
      box-shadow: 0 0 2px var(--highlight);
      background: var(--surface);
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;

    .modal-buttons .btn {
      font-family: inherit;
      font-size: 1.06rem;

      padding: 0.49rem 1.2rem;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      transition: background 0.19s, color 0.16s, box-shadow 0.15s;
      box-shadow: 0 1px 6px #1c014233;
    }

    .btn-cancel {

    .btn-cancel:hover {

    .btn-save {

    .btn-save:hover,
    .btn-save:focus {

    .btn-delete {

    .btn-delete:hover,
    .btn-delete:focus {

    @media (max-width: 1140px) {
      .calendar-container {

      .upcoming-events {

      aside.sidebar {

      .modal-group .calendar-icon {

  </style>
</head>

              Courses</span></a>

      <a href="/pages/cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span></a>
      <a href="/pages/membership.html" class="secondary"><i class="fa-solid fa-crown"></i> <span>Membership</span></a>

      <div class="sidebar-spacer"></div>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <input type="text" id="searchBar" placeholder="Search for upcoming events or more..."
        aria-label="Search for upcoming events or more..." />
      <div style="
            display: flex;
            align-items: center;
            gap: 0.4rem;
            position: relative;
          ">
        <button class="notif-btn" id="notifBtn" title="Notifications" aria-label="Notifications" type="button">
          <i class="fa-solid fa-bell"></i>
          <span id="notifBadge" class="notif-badge" style="display: none">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown" role="region" aria-label="Notification list">
          <div id="notifList"></div>
          <button type="button" id="clearNotifBtn">Clear All</button>

        <div class="profile-menu-container" id="profileMenuWrap">
          <button class="profile-avatar-btn" id="profileAvatarBtn" aria-haspopup="true" aria-expanded="false">
            <span id="profileInitials">L</span>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <div class="profile-meta" id="profileName">Lokesh G</div>
            <div class="profile-role" id="profileRole" style="display: none">
              Member
            </div>
            <a href="#"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            <button type="button">
              <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="info-blocks" aria-label="Summary info blocks">
      <div class="info-block" role="region" aria-label="Total events" tabindex="0">
        <h4><span class="block-emoji">📅</span>Total Events</h4>
        <div class="value" id="totalEventsCount">0</div>
      </div>
      <div class="info-block" role="region" aria-label="Events this month" tabindex="0">
        <h4><span class="block-emoji">🗓️</span>This Month's Events</h4>
        <div class="value" id="monthEventsCount">0</div>
      </div>
      <div class="info-block" role="region" aria-label="Pending tasks" tabindex="0">

        <div class="value" id="pendingTasksCount">3</div>
      </div>

    <section class="calendar-container" aria-label="Calendar and upcoming events">
      <section class="calendar" aria-label="Monthly calendar">
        <div class="calendar-header">
          <button aria-label="Previous month" id="prevMonthBtn">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <h2 id="monthYear">July 2025</h2>
          <button aria-label="Next month" id="nextMonthBtn">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>
        <div class="calendar-days" id="calendarDays" role="grid" aria-label="Calendar days"></div>

    <div class="modal-overlay" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
      aria-describedby="modalDesc">
      <div class="modal event-modal" role="document">
        <h3 id="modalTitle">Add / Edit Event</h3>
        <form id="eventForm" autocomplete="off">
          <div class="modal-group">
            <label for="eventTitleInput"><span class="input-emoji">✏️</span>Event Title</label>
            <input type="text" id="eventTitleInput" name="title" autocomplete="off" required
              placeholder="Enter event name" />
          </div>
          <div class="modal-group">
            <label for="eventDescInput"><span class="input-emoji">📝</span>Description</label>
            <input type="text" id="eventDescInput" name="description" autocomplete="off"
              placeholder="Enter event description (optional)" />
          </div>
          <div class="modal-group date-group">
            <label for="eventDateInput"><span class="input-emoji">📆</span>Event Date</label>
            <div class="date-input-wrapper">
              <input type="date" id="eventDateInput" name="date" required />
              <i class="fa-solid fa-calendar-days calendar-icon-right"></i>
              <!-- Moved purple icon to right -->
            </div>
          </div>

          <div class="modal-buttons">
            <button type="button" class="btn btn-cancel" id="cancelBtn">
              Cancel
            </button>
            <button type="button" class="btn btn-delete" id="deleteBtn" style="display: none">
              Delete
            </button>
            <button type="submit" class="btn btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const coursesMenu = document.getElementById("coursesMenu");
    coursesMenu.querySelector(".dropdown-btn").onclick = function (e) {
      e.stopPropagation();
      coursesMenu.classList.toggle("open");
    };
    document.body.addEventListener("click", function (e) {
      if (!coursesMenu.contains(e.target))
        coursesMenu.classList.remove("open");
    });

    const user = { initials: "L", name: "Lokesh G", member: "pro" };
    document.getElementById("profileInitials").textContent = user.initials;
    document.getElementById("profileName").textContent = user.name;
    const profileRole = document.getElementById("profileRole");
    if (user.member === "pro") {
      profileRole.textContent = "Pro Member";
      profileRole.style.display = "block";
    } else if (user.member === "premium") {
      profileRole.textContent = "Premium Member";
      profileRole.style.display = "block";
    } else {
      profileRole.style.display = "none";
    }

    const profileBtn = document.getElementById("profileAvatarBtn");
    const profileWrap = document.getElementById("profileMenuWrap");
    profileBtn.onclick = function (e) {
      e.stopPropagation();
      profileWrap.classList.toggle("open");
    };
    document.body.addEventListener("click", function (e) {
      if (!profileWrap.contains(e.target))
        profileWrap.classList.remove("open");
    });

    // Notifications badge
    const notifBadge = document.getElementById("notifBadge");
    const notifBtn = document.getElementById("notifBtn");
    let unreadNotifications = 3;
    notifBtn.addEventListener("click", () => {
      unreadNotifications = 0;
      notifBadge.style.display = "none";
      alert("You checked your notifications!");
    });
    notifBadge.textContent = unreadNotifications;
    notifBadge.style.display =
      unreadNotifications > 0 ? "inline-block" : "none";

    // Calendar logic elements
    const calendarDays = document.getElementById("calendarDays");
    const monthYearLabel = document.getElementById("monthYear");
    const prevBtn = document.getElementById("prevMonthBtn");
    const nextBtn = document.getElementById("nextMonthBtn");
    const upcomingEventsList = document.getElementById("upcomingEventsList");
    const eventModal = document.getElementById("eventModal");
    const eventForm = document.getElementById("eventForm");
    const eventTitleInput = document.getElementById("eventTitleInput");
    const eventDateInput = document.getElementById("eventDateInput");
    const cancelBtn = document.getElementById("cancelBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const totalEventsCountEl = document.getElementById("totalEventsCount");
    const monthEventsCountEl = document.getElementById("monthEventsCount");
    const pendingTasksCountEl = document.getElementById("pendingTasksCount"); // Add this element in HTML to show pending tasks count
    const addEventBtn = document.getElementById("addEventBtn");

    let currentDate = new Date();

    // Add completed property to legacy events if missing
    let events = JSON.parse(localStorage.getItem("calendarEvents")) || [
      {
        id: generateId(),
        date: "2025-07-29",
        title: "Quiz 3 - JavaScript",
        completed: false,
      },
      {
        id: generateId(),
        date: "2025-08-01",
        title: "Project #5 Submission",
        completed: false,
      },
      {
        id: generateId(),
        date: "2025-08-03",
        title: "Peer Review - React",
        completed: false,
      },
      {
        id: generateId(),
        date: "2025-08-15",
        title: "Final Exam",
        completed: false,
      },
    ];
    // Ensure all events have completed property (for safety)
    events.forEach((ev) => {
      if (typeof ev.completed === "undefined") ev.completed = false;
    });

    let editingEventId = null;

    function generateId() {
      return "ev_" + Math.random().toString(36).substr(2, 9);
    }

    function saveEventsToStorage() {
      localStorage.setItem("calendarEvents", JSON.stringify(events));
    }

    function updateInfoBlocks(year, month) {
      const monthStr = `${year}-${String(month + 1).padStart(2, "0")}`;
      const monthCount = events.filter((ev) =>
        ev.date.startsWith(monthStr)
      ).length;
      monthEventsCountEl.textContent = monthCount;

      totalEventsCountEl.textContent = events.length;

      if (pendingTasksCountEl) {
        const pendingCount = events.filter((ev) => !ev.completed).length;
        pendingTasksCountEl.textContent = pendingCount;
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      monthYearLabel.textContent = `${monthNames[month]} ${year}`;

      const startDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      calendarDays.innerHTML = "";
      const today = new Date();
      const isCurrentMonth =
        today.getFullYear() === year && today.getMonth() === month;

      for (let i = 0; i < startDay; i++) {
        const spacerCell = document.createElement("div");
        spacerCell.classList.add("calendar-day", "empty");
        spacerCell.setAttribute("role", "presentation");
        spacerCell.style.pointerEvents = "none";
        calendarDays.appendChild(spacerCell);
      }

      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const dayCell = document.createElement("div");
        dayCell.classList.add("calendar-day");
        dayCell.setAttribute("role", "gridcell");
        dayCell.setAttribute("tabindex", "0");
        dayCell.textContent = dayNum;

        const dayDate = new Date(year, month, dayNum);
        dayCell.dataset.date = dayDate.toISOString().split("T")[0];
        dayCell.style.cursor = "pointer";

        if (isCurrentMonth && dayNum === today.getDate()) {
          dayCell.classList.add("today");
        }

        const dayISO = dayCell.dataset.date;
        const eventsOnDay = events.filter((ev) => ev.date === dayISO);

        if (eventsOnDay.length > 0) {
          dayCell.classList.add("event");
          dayCell.setAttribute(
            "aria-label",
            `Events on ${dayNum} ${monthNames[month]}: ${eventsOnDay
              .map((ev) => ev.title)
              .join(", ")}`
          );

          eventsOnDay.forEach((ev) => {
            const evEl = document.createElement("div");
            evEl.textContent = ev.title;
            evEl.className = "calendar-event";
            evEl.title = ev.title;
            evEl.draggable = true;
            evEl.dataset.eventId = ev.id;

            evEl.addEventListener("dragstart", dragStart);
            evEl.addEventListener("dragend", dragEnd);
            evEl.addEventListener("click", (e) => {
              e.stopPropagation();
              openModalForEdit(ev.id);
            });

            dayCell.appendChild(evEl);
          });
        } else {
          dayCell.setAttribute(
            "aria-label",
            `${dayNum} ${monthNames[month]}`
          );
        }

        dayCell.addEventListener("dragover", dragOver);
        dayCell.addEventListener("drop", drop);
        dayCell.addEventListener("click", () => {
          openModalForNew(dayCell.dataset.date);
        });

        calendarDays.appendChild(dayCell);
      }

      updateInfoBlocks(year, month); // ✅ Still call at the end
    }

    // Drag and drop handlers
    let draggedEventId = null;
    let dragGhost;
    function dragStart(e) {
      draggedEventId = e.target.dataset.eventId;
      e.dataTransfer.effectAllowed = "move";
      dragGhost = e.target.cloneNode(true);
      dragGhost.style.position = "absolute";
      dragGhost.style.top = "-1000px";
      dragGhost.style.left = "-1000px";
      dragGhost.style.width = e.target.offsetWidth + "px";
      dragGhost.style.opacity = "0.7";
      dragGhost.style.pointerEvents = "none";
      document.body.appendChild(dragGhost);
      e.dataTransfer.setDragImage(
        dragGhost,
        dragGhost.offsetWidth / 2,
        dragGhost.offsetHeight / 2
      );
      e.target.classList.add("dragging");
    }
    function dragEnd(e) {
      draggedEventId = null;
      if (dragGhost) {
        document.body.removeChild(dragGhost);
        dragGhost = null;
      }
      e.target.classList.remove("dragging");
    }
    function dragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      e.currentTarget.style.backgroundColor = "#494a75";
    }
    function drop(e) {
      e.preventDefault();
      e.currentTarget.style.backgroundColor = "";
      if (draggedEventId && e.currentTarget.dataset.date) {
        const newDate = e.currentTarget.dataset.date;
        const evIndex = events.findIndex((ev) => ev.id === draggedEventId);
        if (evIndex > -1) {
          events[evIndex].date = newDate;
          saveEventsToStorage();
          renderCalendar(currentDate);
          renderUpcomingEvents();
        }
      }
    }
    calendarDays.addEventListener("dragleave", (e) => {
      e.target.style.backgroundColor = "";
    });

    // Modal open/close
    function openModalForNew(date) {
      editingEventId = null;
      eventTitleInput.value = "";
      eventDateInput.value = date || "";
      deleteBtn.style.display = "none";
      openModal();
    }
    function openModalForEdit(eventId) {
      editingEventId = eventId;
      const ev = events.find((e) => e.id === eventId);
      if (!ev) return;
      eventTitleInput.value = ev.title;
      eventDateInput.value = ev.date;
      deleteBtn.style.display = "inline-block";
      openModal();
    }
    function openModal() {
      eventModal.classList.add("active");
      eventTitleInput.focus();
    }
    function closeModal() {
      eventModal.classList.remove("active");
      editingEventId = null;
      eventForm.reset();
    }
    cancelBtn.addEventListener("click", () => {
      closeModal();
    });
    eventModal.addEventListener("click", (e) => {
      if (e.target === eventModal) closeModal();
    });

    // Event form submit
    eventForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = eventTitleInput.value.trim();
      const date = eventDateInput.value;
      if (!title || !date) return;

      if (editingEventId) {
        const idx = events.findIndex((ev) => ev.id === editingEventId);
        if (idx > -1) {
          events[idx].title = title;
          events[idx].date = date;
          // Preserve completed status when editing
        }
      } else {
        events.push({ id: generateId(), title, date, completed: false });
      }
      saveEventsToStorage();
      renderCalendar(currentDate);
      renderUpcomingEvents();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      updateInfoBlocks(year, month);

      closeModal();
    });

    // Delete event button
    deleteBtn.addEventListener("click", () => {
      if (editingEventId) {
        events = events.filter((ev) => ev.id !== editingEventId);
        saveEventsToStorage();
        renderCalendar(currentDate);
        renderUpcomingEvents();

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        updateInfoBlocks(year, month);

        closeModal();
      }
    });

    // Render upcoming events with completed toggle
    function renderUpcomingEvents() {
      const todayISO = new Date().toISOString().split("T")[0];
      const upcoming = events
        .filter((ev) => ev.date >= todayISO)
        .sort((a, b) => a.date.localeCompare(b.date));
      upcomingEventsList.innerHTML = "";
      if (upcoming.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No upcoming events.";
        upcomingEventsList.appendChild(li);
        return;
      }
      upcoming.forEach((ev) => {
        const li = document.createElement("li");
        li.style.display = "flex";
        li.style.justifyContent = "space-between";
        li.style.alignItems = "center";

        const titleDiv = document.createElement("div");
        titleDiv.className = "event-title";
        titleDiv.textContent = ev.title;
        titleDiv.style.flexGrow = "1";
        if (ev.completed) {
          titleDiv.style.textDecoration = "line-through";
          titleDiv.style.color = "#888";
        }

        const dateDiv = document.createElement("div");
        dateDiv.className = "event-date";
        const evDate = new Date(ev.date);
        dateDiv.textContent = evDate.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
        dateDiv.style.marginLeft = "12px";

        // Checkbox to toggle completed state
        const completeCheckbox = document.createElement("input");
        completeCheckbox.type = "checkbox";
        completeCheckbox.checked = ev.completed;
        completeCheckbox.title = ev.completed
          ? "Mark as Pending"
          : "Mark as Completed";
        completeCheckbox.style.marginLeft = "12px";
        completeCheckbox.addEventListener("change", () => {
          ev.completed = completeCheckbox.checked;
          saveEventsToStorage();
          renderUpcomingEvents();
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();
          updateInfoBlocks(year, month);
        });

        li.appendChild(titleDiv);
        li.appendChild(dateDiv);
        li.appendChild(completeCheckbox);
        upcomingEventsList.appendChild(li);
      });
    }

    function animateCalendarTransition(newDate) {
      calendarDays.classList.add("fade-out");

      setTimeout(() => {
        currentDate = newDate;
        renderCalendar();
        calendarDays.classList.remove("fade-out");
        calendarDays.classList.add("fade-in");

        // Remove fade-in class after animation completes
        setTimeout(() => {
          calendarDays.classList.remove("fade-in");
        }, 300);
      }, 300);
    }

    prevBtn.onclick = () => {
      const newDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() - 1,
        1
      );
      animateCalendarTransition(newDate);
    };

    nextBtn.onclick = () => {
      const newDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + 1,
        1
      );
      animateCalendarTransition(newDate);
    };

    calendarDays.addEventListener("keydown", (e) => {
      const focusEl = document.activeElement;
      if (!focusEl.classList.contains("calendar-day")) return;
      let newFocus;
      switch (e.key) {
        case "ArrowRight":
          newFocus = focusEl.nextElementSibling;
          break;
        case "ArrowLeft":
          newFocus = focusEl.previousElementSibling;
          break;
        case "ArrowDown":
          newFocus =
            focusEl.parentElement.children[
            Array.from(focusEl.parentElement.children).indexOf(focusEl) + 7
            ];
          break;
        case "ArrowUp":
          newFocus =
            focusEl.parentElement.children[
            Array.from(focusEl.parentElement.children).indexOf(focusEl) - 7
            ];
          break;
        case "Enter":
        case " ":
          if (focusEl.dataset.date) {
            e.preventDefault();
            openModalForNew(focusEl.dataset.date);
          }
          break;
      }
      if (
        newFocus &&
        newFocus.classList.contains("calendar-day") &&
        !newFocus.classList.contains("outside")
      ) {
        newFocus.focus();
        e.preventDefault();
      }
    });

    addEventBtn.addEventListener("click", () => {
      const todayISO = new Date().toISOString().split("T")[0];
      openModalForNew(todayISO);
    });

    const searchBar = document.getElementById("searchBar");

    // Initializations
    renderCalendar(currentDate);
    renderUpcomingEvents();
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    updateInfoBlocks(year, month);

    searchBar.addEventListener("input", () => {
      const query = searchBar.value.trim().toLowerCase();

      // Filter upcoming events by title matching search query
      const filteredEvents = events.filter(ev => ev.title.toLowerCase().includes(query));

      upcomingEventsList.innerHTML = "";

      if (filteredEvents.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No matching events found.";
        upcomingEventsList.appendChild(li);
        return;
      }

      filteredEvents.forEach(ev => {
        const li = document.createElement("li");
        li.style.display = "flex";
        li.style.justifyContent = "space-between";
        li.style.alignItems = "center";

        const titleDiv = document.createElement("div");
        titleDiv.className = "event-title";
        titleDiv.textContent = ev.title;
        titleDiv.style.flexGrow = "1";
        if (ev.completed) {
          titleDiv.style.textDecoration = "line-through";
          titleDiv.style.color = "#888";
        }

        const dateDiv = document.createElement("div");
        dateDiv.className = "event-date";
        const evDate = new Date(ev.date);
        dateDiv.textContent = evDate.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
        dateDiv.style.marginLeft = "12px";

        const completeCheckbox = document.createElement("input");
        completeCheckbox.type = "checkbox";
        completeCheckbox.checked = ev.completed;
        completeCheckbox.title = ev.completed ? "Mark as Pending" : "Mark as Completed";
        completeCheckbox.style.marginLeft = "12px";
        completeCheckbox.addEventListener("change", () => {
          ev.completed = completeCheckbox.checked;
          saveEventsToStorage();
          // Refresh the filtered list based on current query
          searchBar.dispatchEvent(new Event("input"));
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();
          updateInfoBlocks(year, month);
        });

        li.appendChild(titleDiv);
        li.appendChild(dateDiv);
        li.appendChild(completeCheckbox);
        upcomingEventsList.appendChild(li);
      });
    });

  </script>
</body>

</html>
