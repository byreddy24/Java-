<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Poppins&display=swap');
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Poppins', Arial, sans-serif;
      text-decoration: none;
      list-style: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(90deg, #23254a 60%, #181a23 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-container {
      background: #181a23;
      border-radius: 30px;
      box-shadow: 0 4px 24px #23254a99;
      max-width: 420px;
      width: 93vw;
      padding: 38px 32px 32px 32px;
      margin: 38px;
      color: #ececf1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .contact-container h2 {
      font-weight: 800;
      text-align: center;
      font-size: 2.1rem;
      color: #ffe066;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .contact-container p {
      color: #c0c3e6;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    .input-group {
      margin-bottom: 22px;
      position: relative;
    }

    .input-group label {
      color: #c0c3e6;
      font-size: 1rem;
      margin-bottom: 7px;
      display: block;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      background: #21222d;
      color: #ececf1;
      padding: 13px 44px 13px 17px;
      border-radius: 8px;
      border: 2px solid transparent;
      font-size: 1rem;
      font-weight: 500;
      transition: border 0.2s, background 0.2s;
      outline: none;
      resize: none;
    }
    .input-group textarea {
      min-height: 110px;
      line-height: 1.5;
      max-height: 220px;
      padding-right: 17px;
    }

    .input-group input:focus, .input-group textarea:focus {
      border: 2px solid #ffe066;
      background: #23254a;
    }

    .input-group i {
      position: absolute;
      right: 19px;
      top: 42px;
      font-size: 1.32rem;
      color: #8267e5;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-group input:focus + i,
    .input-group textarea:focus + i {
      color: #ffe066;
    }

    button[type="submit"] {
      width: 100%;
      height: 48px;
      background: #ffe066;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1.08rem;
      color: #232054;
      font-weight: 700;
      margin-top: 5px;
      letter-spacing: 1px;
      box-shadow: 0 2px 10px #ffe06640;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    button[type="submit"]:hover {
      background: #ffed96;
      color: #181a23;
      box-shadow: 0 2px 14px #ffe06680;
    }

    .form-message {
      margin-top: 15px;
      min-height: 18px;
      text-align: center;
      font-size: 0.97rem;
      transition: color 0.1s;
      letter-spacing: 0.3px;
    }

    /* Success/Warning colors */
    .form-message.error {
      color: #ef3550;
    }
    .form-message.success {
      color: #41d17b;
    }
    .form-message.info {
      color: #ffe066;
    }

    @media (max-width: 600px) {
      .contact-container {
        max-width: 99vw;
        padding: 18px 6vw 16px 6vw;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        min-height: 99vh;
      }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <form id="contactForm" autocomplete="off">
    <h2>Contact Us</h2><br>
      <div class="input-group">
        <label for="name">Name : </label>
        <input type="text" id="name" placeholder="Your Name" autocomplete="off" required />
        <i class="bx bxs-user"></i>
      </div>
      <div class="input-group">
        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="off" required />
        <i class="bx bxs-envelope"></i>
      </div>
      <div class="input-group">
        <label for="message">Message : </label>
        <textarea id="message" placeholder="Type your message..." required></textarea>
        <i class="bx bxs-message-dots"></i>
      </div>
      <button type="submit">Send Message</button>
      <div id="form-message" class="form-message"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('contactForm');
    const msg = document.getElementById('form-message');

    function validateEmail(email) {
      // Simple RFC2822 regex
      return /^([a-zA-Z0-9_.\-+])+@([a-zA-Z0-9_\-+])+\.([a-zA-Z0-9]{2,})$/.test(email);
    }

    form.onsubmit = function(e) {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const message = form.message.value.trim();

      if (!name || !email || !message) {
        msg.textContent = 'Please fill out all the fields.';
        msg.className = 'form-message error';
        return;
      }

      if (!validateEmail(email)) {
        msg.textContent = 'Please enter a valid email address.';
        msg.className = 'form-message error';
        return;
      }

      msg.textContent = 'Sending...';
      msg.className = 'form-message info';

      setTimeout(() => {
        msg.textContent = 'Thank you for your message! We will get back to you soon.';
        msg.className = 'form-message success';
        form.reset();
      }, 1200);
    };
  </script>
</body>
</html>
