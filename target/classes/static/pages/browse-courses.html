<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS Browse Courses</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ffe066;
      --highlight: #8267e5;
      --bg-dark: #181a23;
      --surface: #23254a;
      --surface-2: #22243a;
      --surface-3: #222236;
      --surface-card: #23243f;
      --text-main: #ececf1;
      --text-soft: #c0c3e6;
      --shadow: 0 2px 18px rgba(20, 20, 34, 0.16);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Inter", "Arial", sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    aside.sidebar {
      width: 250px;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 99;
      min-width: 250px;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0 18px 0;
    }

    .sidebar-header img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px #efd24a55;
      background: #fff;
      margin-bottom: 9px;
    }

    .sidebar-divider {
      width: 60%;
      height: 3px;
      background: linear-gradient(to right, #ffe066 0%, #8267e5 100%);
      border-radius: 2px;
      margin-bottom: 12px;
    }

    .sidebar-logo-text {
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
      user-select: none;
      text-shadow: 0 2px 10px #ffe06610;
      margin-bottom: 19px;
      text-align: center;
      white-space: nowrap;
    }

    .sidebar nav {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar nav a,
    .sidebar nav button {
      font-weight: 600;
      font-size: 1.07rem;
      color: var(--text-main);
      text-decoration: none;
      padding: 13px 20px 13px 17px;
      border-radius: 0 14px 14px 0;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      transition: background 0.13s, color 0.13s;
      border-left: 4px solid transparent;
      margin-left: -1rem;
    }

    .sidebar nav a.active,
    .sidebar nav a:hover,
    .sidebar nav button.active,
    .sidebar nav button:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
      font-weight: 700;
    }

    .sidebar nav i {
      min-width: 33px;
      min-height: 33px;
      font-size: 1.32rem;
      border-radius: 50%;
      background: #262740;
      color: var(--highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.13s;
    }

    .sidebar nav a.active i,
    .sidebar nav a:hover i,
    .sidebar nav button.active i,
    .sidebar nav button:hover i {
      background: var(--highlight);
      color: #fff !important;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      justify-content: space-between;
    }

    .dropdown .fa-chevron-down {
      margin-left: auto;
      font-size: 0.98em;
      transition: transform 0.19s;
    }

    .dropdown.open .fa-chevron-down {
      transform: rotate(180deg);
    }

    .dropdown-list {
      display: none;
      flex-direction: column;
      padding-left: 34px;
      background: transparent;
      margin: 0;
    }

    .dropdown.open .dropdown-list {
      display: flex;
    }

    .dropdown-list a {
      padding: 7px 10px 7px 20px;
      font-size: 0.96em;
      border-radius: 8px;
      margin-left: 0;
      border-left: 4px solid transparent;
    }

    .dropdown-list a.active,
    .dropdown-list a:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
    }

    .sidebar nav .secondary {
      color: var(--text-soft);
      font-weight: 600;
      opacity: 0.86;
      font-size: 0.98rem;
    }

    .sidebar-spacer {
      flex-grow: 10;
    }

    .sidebar-footer {
      padding-left: 7px;
      padding-bottom: 22px;
    }

    .sidebar-footer a {
      color: var(--text-main);
      font-size: 1.07rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 1em;
      padding: 13px 20px 13px 17px;
      border-radius: 0 14px 14px 0;
      transition: background 0.13s, color 0.13s;
      border-left: 4px solid transparent;
      margin-left: -1rem;
      font-weight: 600;
    }

    .sidebar-footer a.active,
    .sidebar-footer a:hover {
      background: var(--primary);
      color: #22223a !important;
      border-left: 4px solid var(--highlight);
    }

    .sidebar-footer a i {
      min-width: 33px;
      min-height: 33px;
      font-size: 1.32rem;
      border-radius: 50%;
      background: #262740;
      color: var(--highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.13s;
    }

    .sidebar-footer a.active i,
    .sidebar-footer a:hover i {
      background: var(--highlight);
      color: #fff !important;
    }

    main {
      margin-left: 250px;
      padding: 2.5rem 3.5rem 2.5rem 3.5rem;
      flex: 1;
      min-height: 100vh;
      background: var(--bg-dark);
    }

    /* Topbar */
    header.topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.8rem;
    }

    .topbar input[type="text"] {
      width: 100%;
      max-width: 320px;
      background: var(--surface-2);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1.5px solid #3e4159;
      font-size: 1.02rem;
      outline: none;
      box-shadow: 0 1px 8px #ffe06617;
    }

    .profile-menu-container {
      position: relative;
      margin-left: 1.3rem;
    }

    .profile-avatar-btn {
      background: var(--highlight);
      color: #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2.5px solid #ffe06655;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--primary);
      border: none;
      outline: none;
      transition: background 0.16s, color 0.16s;
      text-decoration: none;
      /* No underline */
    }

    .profile-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      min-width: 180px;
      background: var(--surface-3);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      z-index: 40;
      padding: 0.4em 0.1em;
      flex-direction: column;
      color: var(--text-main);
      text-align: left;
    }

    .profile-menu-container.open .profile-dropdown {
      display: flex;
    }

    .profile-dropdown .profile-meta {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.02em;
      margin: 0.2em 0 0.2em 0;
      line-height: 1.2;
    }

    .profile-dropdown .profile-role {
      font-size: 1em;
      padding: 0 1.22em 0.3em 2.15em;
      color: var(--highlight);
      font-style: italic;
      font-weight: 600;
      opacity: 0.82;
    }

    /* Remove underline on dropdown links and buttons */
    .profile-dropdown a,
    .profile-dropdown button {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 0.8em 1.25em;
      text-align: left;
      cursor: pointer;
      font-size: 1.07em;
      font-family: inherit;
      transition: background 0.13s, color 0.12s;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 0.7em;
      text-decoration: none !important;
    }

    .profile-dropdown a:hover,
    .profile-dropdown button:hover {
      background: var(--primary);
      color: #22223a;
    }

    .profile-dropdown i {
      color: var(--highlight);
      font-size: 1.02em;
    }

    /* Notification button and dropdown */
    .notif-btn {
      background: none;
      outline: none;
      border: none;
      padding: 0;
      margin: 0 11px 0 0;
      position: relative;
      cursor: pointer;
      text-decoration: none !important;
    }

    .notif-btn i {
      font-size: 1.54em;
      color: var(--highlight);
      background: transparent;
      border-radius: 50%;
      transition: background 0.12s, color 0.13s;
      padding: 7px 9px;
    }

    .notif-btn:hover i {
      background: #23243f;
      color: var(--primary);
    }

    .notif-badge {
      position: absolute;
      top: 2px;
      right: 0.8rem;
      background: #e64545;
      color: #fff;
      font-size: 0.85em;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 6px;
      min-width: 18px;
      text-align: center;
      box-shadow: 0 0 5px #0005;
      z-index: 2;
      display: inline-block;
    }

    .notif-dropdown {
      position: absolute;
      right: 44px;
      top: 44px;
      min-width: 260px;
      background: var(--surface-3);
      color: var(--text-main);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      z-index: 110;
      padding: 0.3em 0.1em 0.6em 0.1em;
      font-size: 1em;
      max-height: 360px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }

    #notifList {
      max-height: 280px;
      overflow-y: auto;
    }

    .notif-item {
      padding: 0.75em 1.2em;
      border-bottom: 1px solid #23243f55;
      background: none;
      color: inherit;
      cursor: pointer;
      transition: background 0.11s;
      white-space: normal;
      word-wrap: break-word;
    }

    .notif-item.unread {
      background: #ffe06622;
      font-weight: 700;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-dropdown button {
      background: var(--primary);
      color: #22223a;
      border: none;
      padding: 0.65em 1.2em;
      border-radius: 7px;
      margin: 0.45em auto 0;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.02em;
      text-align: center;
      display: block;
    }

    .notif-dropdown button:hover {
      background: var(--highlight);
      color: #fff;
    }

    /* === Browse courses content styles === */
    .browse-filters {
      background: var(--surface-2);
      border-radius: 11px;
      box-shadow: var(--shadow-card);
      padding: 1rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .browse-filters label {
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
    }

    .browse-filters input,
    .browse-filters select {
      background: var(--bg-dark);
      border: 1.5px solid var(--highlight);
      border-radius: 7px;
      color: var(--primary);
      font-size: 1rem;
      padding: 0.47rem 0.8rem;
      margin-left: 0.5em;
    }

    .browse-filters select:focus,
    .browse-filters input:focus {
      border-color: var(--primary-hover);
      outline: none;
    }

    .available-courses-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: flex-start;
    }

    .browse-card {
      background: var(--surface-card);
      border-radius: 13px;
      box-shadow: var(--shadow-card);
      min-width: 260px;
      max-width: 340px;
      flex: 1 0 260px;
      padding: 1.35rem 1.15rem 1.3rem 1.15rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.19s, box-shadow 0.22s;
      border: 1.5px solid #ffe0661f;
      position: relative;
      user-select: none;
    }

    .browse-card:hover {
      transform: translateY(-7px) scale(1.03);
      border: 1.5px solid #ffe06670;
      box-shadow: 0 10px 32px #ffe06627;
    }

    .browse-card img {
      width: 70px;
      height: 70px;
      border-radius: 11px;
      object-fit: cover;
      box-shadow: 0 1px 7px #ffe06629;
      border: 2px solid #ffe06644;
      background: #23254a;
      margin-bottom: 1rem;
    }

    .browse-card h4 {
      color: var(--primary);
      font-size: 1.12rem;
      margin: 0.2rem 0 0.3rem 0;
      font-weight: 700;
      text-align: center;
    }

    .browse-card p {
      color: var(--text-soft);
      margin: 0.16rem 0 0.16rem 0;
      font-size: 0.99rem;
      font-weight: 500;
      text-align: center;
    }

    .browse-card .enroll-btn {
      margin-top: 0.9rem;
      background: var(--highlight);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.54rem 1.1rem;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      transition: background 0.18s, color 0.12s;
      user-select: none;
      align-self: center;
    }

    .browse-card .enroll-btn:hover {
      background: #fff;
      color: var(--highlight);
    }

    /* Responsive */
    @media (max-width: 900px) {
      main {
        margin-left: 73px;
        padding: 1.8rem 1.5rem 2rem 1.5rem;
        gap: 1.6rem;
      }

      .available-courses-list {
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .browse-card {
        min-width: unset;
        max-width: 100vw;
      }

      .browse-card img {
        width: 55px;
        height: 55px;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/assets/images/logo.png" alt="SkillSpark Logo" />
      <div class="sidebar-divider"></div>
      <div class="sidebar-logo-text">SkillSpark</div>
    </div>
    <nav>
      <a href="/pages/dashboard.html"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
      <a href="/pages/calendar.html"><i class="fa-solid fa-calendar-days"></i> <span>Calendar</span></a>
      <div class="dropdown" id="coursesMenu">
        <button class="dropdown-btn" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-layer-group"></i> <span>Courses</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="dropdown-list" role="menu" aria-label="Courses submenu">
          <a href="/pages/my-courses.html"><i class="fa-solid fa-graduation-cap"></i>
            <span>My Courses</span></a>
          <a href="/pages/browse-courses.html" class="active"><i class="fa-solid fa-book"></i> <span>Browse
              Courses</span></a>
        </div>
      </div>
      <a href="/pages/community.html"><i class="fa-solid fa-users"></i> <span>Community</span></a>
      <a href="/pages/cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span></a>
      <a href="/pages/membership.html" class="secondary"><i class="fa-solid fa-crown"></i> <span>Membership</span></a>
      <a href="/pages/help.html"><i class="fa-solid fa-circle-question"></i> <span>Help</span></a>
      <div class="sidebar-spacer"></div>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <input type="text" placeholder="Search courses to enroll..." aria-label="Search all courses" />
      <div style="
            display: flex;
            align-items: center;
            gap: 0.4rem;
            position: relative;
          ">
        <button class="notif-btn" id="notifBtn" title="Notifications" aria-label="Notifications" type="button">
          <i class="fa-solid fa-bell"></i>
          <span id="notifBadge" class="notif-badge" style="display: none">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown" role="region" aria-label="Notification list">
          <div id="notifList"></div>
          <button type="button" id="clearNotifBtn">Clear All</button>
        </div>

        <div class="profile-menu-container" id="profileMenuWrap">
          <button class="profile-avatar-btn" id="profileAvatarBtn" aria-haspopup="true" aria-expanded="false">
            <span id="profileInitials">L</span>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <div class="profile-meta" id="profileName">Lokesh G</div>
            <div class="profile-role" id="profileRole" style="display: none">
              Member
            </div>
            <a href="#"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            <button type="button">
              <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="browse-filters">
      <label>Category:
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="All">All</option>
        </select>
      </label>
      <label>Level:
        <select id="levelFilter" aria-label="Filter by level">
          <option value="All">All</option>
        </select>
      </label>
      <label>Instructor:
        <select id="instructorFilter" aria-label="Filter by instructor">
          <option value="All">All</option>
        </select>
      </label>
    </div>

    <section>
      <div class="available-courses-list" id="availableCourses"></div>
    </section>
  </main>

  <script>
    // Sidebar dropdown toggle
    const coursesMenu = document.getElementById("coursesMenu");
    const coursesBtn = coursesMenu.querySelector(".dropdown-btn");
    coursesBtn.onclick = (e) => {
      e.stopPropagation();
      coursesMenu.classList.toggle("open");
      coursesBtn.setAttribute(
        "aria-expanded",
        coursesMenu.classList.contains("open")
      );
    };
    document.body.addEventListener("click", (e) => {
      if (!coursesMenu.contains(e.target)) {
        coursesMenu.classList.remove("open");
        coursesBtn.setAttribute("aria-expanded", "false");
      }
    });

    // Profile dropdown toggle
    const profileBtn = document.getElementById("profileAvatarBtn");
    const profileWrap = document.getElementById("profileMenuWrap");
    profileBtn.onclick = (e) => {
      e.stopPropagation();
      profileWrap.classList.toggle("open");
      profileBtn.setAttribute(
        "aria-expanded",
        profileWrap.classList.contains("open")
      );
    };
    document.body.addEventListener("click", (e) => {
      if (!profileWrap.contains(e.target)) {
        profileWrap.classList.remove("open");
        profileBtn.setAttribute("aria-expanded", "false");
      }
    });

    // Notification dropdown toggle
    const notifBtn = document.getElementById("notifBtn");
    const notifDropdown = document.getElementById("notifDropdown");
    notifBtn.onclick = function (e) {
      e.stopPropagation();
      const isOpen =
        notifDropdown.style.display === "flex" ||
        notifDropdown.style.display === "block";
      notifDropdown.style.display = isOpen ? "none" : "flex";

      // Close profile menu if open
      if (profileWrap.classList.contains("open")) {
        profileWrap.classList.remove("open");
        profileBtn.setAttribute("aria-expanded", "false");
      }
      renderNotif();
    };
    document.body.addEventListener("click", function (e) {
      if (!notifDropdown.contains(e.target) && e.target !== notifBtn) {
        notifDropdown.style.display = "none";
      }
    });

    // User profile info
    const user = {
      initials: "L",
      name: "Lokesh G",
      member: "Member", // Can be 'Member', 'Pro Member', 'Premium Member'
    };
    document.getElementById("profileInitials").textContent = user.initials;
    document.getElementById("profileName").textContent = user.name;
    const profileRole = document.getElementById("profileRole");
    profileRole.textContent = user.member;
    profileRole.style.display = "block";

    // Sample notifications data
    let notifications = [
      {
        id: 1,
        text: 'New course "Advanced React" has been added.',
        unread: true,
      },
      {
        id: 2,
        text: "Your subscription will renew in 5 days.",
        unread: true,
      },
      { id: 3, text: "Welcome to SkillSpark!", unread: false },
    ];

    function renderNotif() {
      const unreadCount = notifications.filter((n) => n.unread).length;
      const badge = document.getElementById("notifBadge");
      badge.textContent = unreadCount;
      badge.style.display = unreadCount > 0 ? "inline-block" : "none";

      const notifList = document.getElementById("notifList");
      notifList.innerHTML = notifications.length
        ? notifications
          .map(
            (n) => `
          <div class="notif-item${n.unread ? " unread" : ""}" data-id="${n.id
              }" tabindex="0">${n.text}</div>
        `
          )
          .join("")
        : '<div style="padding:1em;color:var(--text-soft);">No notifications</div>';
    }

    // Mark as read on click
    document.addEventListener("click", function (e) {
      if (e.target.classList.contains("notif-item")) {
        const id = +e.target.dataset.id;
        notifications = notifications.map((n) =>
          n.id === id ? { ...n, unread: false } : n
        );
        renderNotif();
      }
    });

    // Clear all notifications
    document.getElementById("clearNotifBtn").onclick = function () {
      notifications = [];
      renderNotif();
    };

    // Initial notification render
    renderNotif();

    // Courses data
    const allCourses = [
      {
        title: "Java Programming",
        category: "Development",
        level: "Beginner",
        instructor: "Sana Mathur",
        thumbnail: "https://placehold.co/80x80/2a2a4d/ffe066?text=Java",
      },
      {
        title: "Python Programming",
        category: "Development",
        level: "Beginner",
        instructor: "Amit Sinha",
        thumbnail: "https://placehold.co/80x80/2a2a4d/ffe066?text=Python",
      },
      {
        title: "Web Development",
        category: "Development",
        level: "Intermediate",
        instructor: "Ria Kapoor",
        thumbnail: "https://placehold.co/80x80/2a2a4d/ffe066?text=Web",
      },
      {

    // Dynamically fill filter dropdowns from course data
    function fillFilterOptions() {
      const categories = new Set();
      const levels = new Set();
      const instructors = new Set();

      allCourses.forEach((course) => {
        categories.add(course.category);
        levels.add(course.level);
        instructors.add(course.instructor);
      });

      function setOptions(selectEl, optionsSet) {
        selectEl.innerHTML =
          '<option value="All">All</option>' +
          [...optionsSet]
            .sort()
            .map((opt) => `<option value="${opt}">${opt}</option>`)
            .join("");
      }

      setOptions(document.getElementById("categoryFilter"), categories);
      setOptions(document.getElementById("levelFilter"), levels);
      setOptions(document.getElementById("instructorFilter"), instructors);
    }
    fillFilterOptions();

    // Grab filters and search input
    const categorySelect = document.getElementById("categoryFilter");
    const levelSelect = document.getElementById("levelFilter");
    const instructorSelect = document.getElementById("instructorFilter");
    const searchInput = document.querySelector('.topbar input[type="text"]');

    // Filter and render courses
    function getFilteredCourses() {
      const category = categorySelect.value;
      const level = levelSelect.value;
      const instructor = instructorSelect.value;
      const search = searchInput.value.trim().toLowerCase();

      return allCourses.filter((course) => {
        let match = true;
        if (category !== "All") match = match && course.category === category;
        if (level !== "All") match = match && course.level === level;
        if (instructor !== "All")
          match = match && course.instructor === instructor;
        if (search) {
          const searchMatch =
            course.title.toLowerCase().includes(search) ||
            course.category.toLowerCase().includes(search) ||
            course.instructor.toLowerCase().includes(search);
          match = match && searchMatch;
        }
        return match;
      });
    }

    function renderAvailableCourses(courseArr) {
      const container = document.getElementById("availableCourses");
      container.innerHTML = "";
      if (courseArr.length === 0) {
        container.innerHTML =
          '<div style="color:var(--text-soft);padding:1.6rem;">No courses found matching the filters.</div>';
        return;
      }
      courseArr.forEach((course) => {
        const card = document.createElement("div");
        card.className = "browse-card";

        const thumb = document.createElement("img");
        thumb.src = course.thumbnail;
        thumb.alt = `${course.title} thumbnail`;

        const title = document.createElement("h4");
        title.textContent = course.title;

        const info1 = document.createElement("p");
        info1.textContent = `${course.category} · ${course.level}`;

        const info2 = document.createElement("p");
        info2.textContent = `Instructor: ${course.instructor}`;
        info2.style.marginTop = "0.2rem";

        const btn = document.createElement("button");
        btn.className = "enroll-btn";
        btn.textContent = "Enroll";

        card.appendChild(thumb);
        card.appendChild(title);
        card.appendChild(info1);
        card.appendChild(info2);
        card.appendChild(btn);

        container.appendChild(card);
      });
    }

    // Update course list on filter or search change
    function updateCourseList() {
      const filtered = getFilteredCourses();
      renderAvailableCourses(filtered);
    }

    categorySelect.addEventListener("change", updateCourseList);
    levelSelect.addEventListener("change", updateCourseList);
    instructorSelect.addEventListener("change", updateCourseList);
    searchInput.addEventListener("input", updateCourseList);

    // Initial render
    renderAvailableCourses(allCourses);
  </script>
